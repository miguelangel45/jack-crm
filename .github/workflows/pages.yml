name: Publicar vista del CRM en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar main
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crm-operativo/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: crm-operativo
      - name: Excluir rutas que requieren servidor
        run: mv crm-operativo/src/app/api "$RUNNER_TEMP/crm-api"
      - name: Compilar vista estática
        run: npm run build
        working-directory: crm-operativo
        env:
          NEXT_PUBLIC_PAGES_DEMO: "true"
          NEXT_PUBLIC_SOURCE_SHA: ${{ github.sha }}
      - name: Preparar archivos para Pages
        run: touch crm-operativo/out/.nojekyll
      - name: Subir sitio compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: crm-operativo/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
